[package]
name = "phient"
version = "0.1.0"
edition = "2021"
description = "Phient — the brain of Phient systems, the way ollama is for its models: it holds the arena (every model, one table), the study protocol (predict first, learn after), prose and code as trees of knowing, and the ledgers (Tally, levels, the cast). It knows what it has — a phiano in phinet, a phiora database — runs it, and measures it honestly."
license = "MIT"

[lib]
name = "phient"
path = "src/lib.rs"

[dependencies]
phistd = { path = "../phistd" }
phical = { path = "../phical" }
phiecs = { path = "../phiecs" }
phiclm = { path = "../phiclm" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
